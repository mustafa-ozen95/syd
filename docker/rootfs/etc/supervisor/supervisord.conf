; Konteynerin süreç yöneticisi. PID 1 budur.
;
; Hangi servisin çalışacağı SABİT DEĞİLDİR: veritabanı ya da redis dışarıdan
; verilmişse içerideki karşılığı hiç başlatılmaz. Kararı syd-entrypoint
; verir ve conf.d altına ilgili dosyayı bırakır.

[supervisord]
nodaemon = true
user = root
logfile = /dev/null
logfile_maxbytes = 0
pidfile = /run/supervisord.pid

[unix_http_server]
file = /run/supervisor.sock
chmod = 0700

[rpcinterface:supervisor]
supervisor.rpcinterface_factory = supervisor.rpcinterface:make_main_rpcinterface

[supervisorctl]
serverurl = unix:///run/supervisor.sock

[include]
files = /etc/supervisor/conf.d/*.conf

; --- Web ---------------------------------------------------------------------
[program:php-fpm]
command = /usr/sbin/php-fpm%(ENV_PHP_VERSION)s --nodaemonize --fpm-config /etc/php/%(ENV_PHP_VERSION)s/fpm/php-fpm.conf
priority = 20
autorestart = true
startsecs = 3
stdout_logfile = /dev/stdout
stdout_logfile_maxbytes = 0
stderr_logfile = /dev/stderr
stderr_logfile_maxbytes = 0

[program:nginx]
command = /usr/sbin/nginx -g "daemon off;"
priority = 25
autorestart = true
startsecs = 3
stdout_logfile = /dev/stdout
stdout_logfile_maxbytes = 0
stderr_logfile = /dev/stderr
stderr_logfile_maxbytes = 0

; --- Yeniden başlatma ----------------------------------------------------------
; Panel veritabanını taşımak için konteynerin yeniden başlamasını ister; panel
; kullanıcısı bu sokete erişemediği için isteği root olarak bu döngü yerine
; getirir (bkz. dc-yeniden-baslat).
[program:yeniden-baslat]
command = /usr/local/bin/dc-yeniden-baslat
priority = 40
autorestart = true
stdout_logfile = /dev/stdout
stdout_logfile_maxbytes = 0
stderr_logfile = /dev/stderr
stderr_logfile_maxbytes = 0

; --- Zamanlayıcı -------------------------------------------------------------
; cron yerine schedule:work (routes/console.php): zamanlayıcı konteynerle
; birlikte gelir, sunucuda ayrıca cron satırı gerekmez.
[program:zamanlayici]
command = /usr/bin/php artisan schedule:work
directory = /uygulama
user = syd
priority = 31
autorestart = true
stdout_logfile = /dev/stdout
stdout_logfile_maxbytes = 0
stderr_logfile = /dev/stderr
stderr_logfile_maxbytes = 0
