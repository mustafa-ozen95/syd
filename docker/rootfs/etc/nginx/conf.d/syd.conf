# =============================================================================
#  SYD — Switch Yedek Deposu
# =============================================================================
#  Tek köken, tek sunucu bloğu. İkinci bir kökene (cihaz arayüzü vekili)
#  gerek yok: bu panel hiçbir cihazın arayüzünü vekillemez.
#
#  Yalnız 80 (düz HTTP). TLS'i önündeki vekil bitirir: platformun kendisi
#  (Traefik, Coolify...) ya da Caddy/nginx. Panel isteğin HTTPS
#  olduğunu vekilin X-Forwarded-Proto başlığından bilir (bootstrap/app.php →
#  trustProxies).
# =============================================================================
server {
    listen 80 default_server;

    server_name _;

    root /uygulama/public;
    index index.php;

    charset utf-8;

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ~ ^/index\.php(/|$) {
        fastcgi_pass unix:/run/php/syd.sock;
        fastcgi_split_path_info ^(.+\.php)(/.*)$;
        include fastcgi_params;

        # Portu geri kazandırır; gerekçe nginx.conf'taki map'te.
        fastcgi_param HTTP_HOST $host$istek_portu;

        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_param PATH_INFO $fastcgi_path_info;
        fastcgi_hide_header X-Powered-By;

        # Web tarafında uzun istek yok.
        fastcgi_read_timeout 120s;
    }

    # Junos görüntüsü yükleme (Kurulum sayfası): tek dosya 4 GB'a kadar
    # (config/junos.php upload_max_mb ile aynı). Büyük sınır YALNIZ bu
    # yolda; panelin geri kalanı 32m'de kalır. PHP sınırları da yalnız bu
    # istek için yükselir (PHP_VALUE).
    location ~ ^/setup/image(/[0-9]+)?$ {
        client_max_body_size 4100m;
        client_body_timeout 300s;

        fastcgi_pass unix:/run/php/syd.sock;
        include fastcgi_params;
        fastcgi_param HTTP_HOST $host$istek_portu;
        fastcgi_param SCRIPT_FILENAME $document_root/index.php;
        fastcgi_param SCRIPT_NAME /index.php;
        fastcgi_param PHP_VALUE "upload_max_filesize=4100M
post_max_size=4100M
max_input_time=900
max_execution_time=900";
        fastcgi_hide_header X-Powered-By;
        fastcgi_read_timeout 900s;
    }

    # index.php dışında hiçbir PHP dosyası doğrudan çalıştırılmaz.
    location ~ \.php$ {
        return 404;
    }

    location ~* \.(css|js|mjs|map|jpg|jpeg|png|gif|ico|svg|webp|woff2?|ttf|otf|eot)$ {
        expires 30d;
        access_log off;
        try_files $uri =404;
    }

    location ~ /\.(?!well-known) {
        deny all;
    }
}
